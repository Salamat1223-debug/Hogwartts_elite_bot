<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Wizard Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        #myBoard { width: 90vw; max-width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 4px solid #333; }
        .status { margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Wizard's Chess</h1>
    <div id="myBoard"></div>
    <div class="status" id="status">Sizning yurishingiz...</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://telegram.org/js/games.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var game = new Chess();
        var board = null;

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'Oqlar' : 'Qoralar';

            if (game.in_checkmate()) {
                status = 'O\'yin tugadi. ' + moveColor + ' mot bo\'ldi!';
            } else if (game.in_draw()) {
                status = 'O\'yin tugadi. Durang!';
            } else {
                status = moveColor + 'ning yurishi...';
                if (game.in_check()) {
                    status += ' (Shoh!)';
                }
            }
            $('#status').html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);
        updateStatus();
    </script>
</body>
</html>
